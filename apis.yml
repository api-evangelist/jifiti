  reason: partner-login
  detail: >-
    Both Jifiti developer hubs are ReadMe.io sites behind a site-wide password —
    developers.jifiti.com ("CRED API") and lenders.jifiti.com ("jifiti4lenders") 302
    every path, including /openapi.json and /llms.txt, to /password?redirect=... — and
    the only way to the password is a "Developer Access Request" form on
    www.jifiti.com/api/ that asks for company name and job title before granting one of
    "API for Lenders", "API for Merchants" or "Lending MCP (Alpha)".
