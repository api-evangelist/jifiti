specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Jifiti
providerId: jifiti
created: '2026-05-04'
modified: '2026-08-27'
generated: '2026-08-27'
method: searched
source: https://www.jifiti.com/api/
# REPLACED 2026-08-27. The previous contents were an API Evangelist bulk scaffold dated
# 2026-05-04 (roadmap#35) asserting five per-tier limits (10/100/1000 rpm), burst
# ceilings, X-RateLimit-* response headers and a 429/503 code map. Jifiti publishes NONE
# of that. Inventing rate-limit headers is specifically harmful: an agent would build
# backoff against signals the API does not send. The fabricated values are removed.
tags:
  - Banking
  - Buy Now Pay Later
  - Embedded Lending
  - Fintech
  - Payments
  - Rate Limiting
description: >-
  Jifiti documents no rate limits publicly. The API reference that would carry them
  lives inside two password-gated ReadMe hubs (developers.jifiti.com,
  lenders.jifiti.com), and the API host api.jifiti.com rejects every unauthenticated
  path with an AWS API Gateway 403, so no live RateLimit-* or X-RateLimit-* response
  header could be observed either. limit_count is an honest zero: nothing was published
  and nothing was observable.
limit_count: 0
limits: []
headers: {}
headers_observed: false
responseCodes: {}
policies: []
evidence:
  - url: https://api.jifiti.com/
    status: 403
    finding: >-
      '{"message":"Missing Authentication Token"}' — no RateLimit-*, X-RateLimit-* or
      Retry-After header present on the response
  - url: https://api.jifiti.com/ping
    status: 200
    finding: >-
      body "healthy"; response carries no rate-limit headers, so no runtime signal
      could be captured
  - url: https://developers.jifiti.com/reference
    status: 302
    finding: redirects to /password — reference (and any published limits) is gated
  - url: https://lenders.jifiti.com/reference
    status: 302
    finding: redirects to /password — same gate on the lender hub
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
