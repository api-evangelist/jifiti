# REPLACED 2026-08-27. The previous contents of this file were an API Evangelist bulk
# scaffold dated 2026-05-04 (roadmap#35) that invented three tiers — a "Free" plan with
# a 1,000 req/month quota, a "Professional" plan with 100,000 req/month, and an
# "Enterprise" plan. Jifiti has never published any of that. Those values are removed
# rather than carried forward: a fabricated price sheet for a regulated lender is worse
# than an empty one. What is recorded below is what was actually searched for and found.
tags:
  - Banking
  - Buy Now Pay Later
  - Embedded Lending
  - Fintech
  - Payments
description: >-
  Jifiti publishes no plans, tiers, prices or quotas anywhere on its public site.
  https://www.jifiti.com/pricing/ returns 404 and no pricing page is linked from the
  global navigation, the developer pages, or the sitemap. Jifiti sells a white-labeled
  embedded-lending platform to banks, lenders and merchants under negotiated commercial
  agreements; every route into the product is a "Talk to a lending expert" or
  "Developer Access Request" form. This is an enterprise contact-sales motion with no
  self-serve pricing, and that is the finding — not a gap in the search.
plan_count: 0
plans: []
pricing_model: contact-sales
public_pricing: false
evidence:
  - url: https://www.jifiti.com/pricing/
    status: 404
    finding: no pricing page exists
  - url: https://www.jifiti.com/contact/
    status: 200
    finding: '"Talk to a lending expert" contact form; no prices, tiers or quotas'
  - url: https://www.jifiti.com/api/
    status: 200
    finding: >-
      Developer Access Request form (name, work email, company, job title) gates the
      developer portal; no plan, quota or price is stated
  - url: https://www.jifiti.com/sitemap_index.xml
    status: 200
    finding: no pricing or plans URL in any child sitemap
